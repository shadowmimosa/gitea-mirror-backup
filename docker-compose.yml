# ============================================================
# Gitea Mirror Backup - Docker Compose 配置文件
# ============================================================
# 
# 📖 快速开始：
#   1. 修改 volumes.gitea-data.driver_opts.device 为实际路径
#   2. 复制 env.example 为 .env 并修改配置
#   2. 复制 env.example 为 .env 并修改配置
#      cp env.example .env
#   3. 复制 config.example.yaml 为 config.yaml（可选）
#      cp config.example.yaml config.yaml
#   4. 选择运行模式：
#      - 手动备份：docker compose run --rm backup
#      - 启动 Web：docker compose up -d web
#      - 启动定时：docker compose up -d cron
#      - 全部启动：docker compose --profile full up -d
#
# 📚 详细文档：
#   - 配置说明：docs/configuration.md
#   - 环境变量：docs/ENV-VARIABLES.md
#   - 环境变量：docs/ENV-VARIABLES.md
#   - Docker 指南：docs/docker.md
#   - 主文档：README_CN.md
#
# ⚠️ 重要提示：
#   - docker compose up 不会启动任何服务（这是设计行为）
#   - 所有服务都使用 profiles，需要明确指定才会启动
#   - 配置方式：.env（必需）+ config.yaml（可选）
#   - 配置优先级：.env 环境变量 > config.yaml > 默认值
#
# ============================================================

# ============================================================
# 共享卷定义
# 说明：使用 bind 挂载方式，使备份时的硬链接功能生效
# ============================================================
volumes:
  gitea-data:
    driver: local
    driver_opts:
      type: none      # 使用 bind 挂载而非 volume
      o: bind
      device: /opt/gitea       # 【重要】修改为宿主机上的实际路径
                               # 此目录应包含两个子目录：
                               # - gitea/     (Gitea 数据目录)
                               # - backup/    (备份存储目录)

# ============================================================
# 共享环境变量配置
# 说明：基础配置，更多配置请在 .env 文件或 config/config.yaml 中设置
# ============================================================
x-common-env: &common-env
  # 时区设置
  TZ: Asia/Shanghai

# ============================================================
# 共享卷挂载配置
# 说明：这些卷会被所有备份相关服务共享
# ============================================================
x-common-volumes: &common-volumes
  # 共享数据卷（包含 Gitea 数据和备份目录）
  - gitea-data:/shared:rw
  
  # 日志目录（宿主机路径，用于持久化日志）
  - /var/log/gitea-backup:/logs:rw
  
  # Docker socket（用于与 Docker 守护进程通信，检查容器状态）
  - /var/run/docker.sock:/var/run/docker.sock:ro
  
  # 配置文件挂载（可选，推荐使用 config.yaml 管理复杂配置）
  - ./config.yaml:/app/config.yaml:ro

services:
  # ============================================================
  # 备份服务 - 一次性任务
  # 用途：手动执行备份任务，执行完成后自动退出
  # 使用：docker compose run --rm backup
  # ============================================================
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: gitea-mirror-backup:latest
    container_name: gitea-backup-oneshot
    environment:
      <<: *common-env
    env_file:
      - .env  # 从 .env 文件加载环境变量
    volumes: *common-volumes
    network_mode: bridge
    # 不设置 restart，因为这是一次性任务
    # 使用 profiles 防止 docker compose up 时自动启动
    profiles:
      - manual
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # 恢复辅助服务 - 可选
  # 用途：在宿主机一键进入容器执行 restore.sh
  # 使用：docker compose run --rm -it restore /shared/backup/owner/repo/restore.sh
  # ============================================================
  restore:
    image: gitea-mirror-backup:latest
    container_name: gitea-backup-restore
    entrypoint: /bin/bash
    stdin_open: true
    tty: true
    environment:
      <<: *common-env
    env_file:
      - .env
    volumes: *common-volumes
    network_mode: bridge
    profiles:
      - restore
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Web 管理界面 - 可选服务
  # 用途：提供 Web 界面查看备份历史、状态和手动触发备份
  # 启动：docker compose up -d web
  # 访问：http://localhost:8010
  # 访问：http://localhost:8010
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: gitea-mirror-backup-web:latest
    container_name: gitea-backup-web
    ports:
      - "8010:8000"  # 【可修改】宿主机端口:容器端口
    environment:
      <<: *common-env
    env_file:
      - .env  # 从 .env 文件加载环境变量（包含 SECRET_KEY 等）
      - .env  # 从 .env 文件加载环境变量（包含 SECRET_KEY 等）
    volumes:
      # rw：Web 触发备份时需写入 /shared/backup；只读会导致备份失败
      - gitea-data:/shared:rw
      - ./config.yaml:/app/config.yaml:ro
      - ./web/data:/app/data   # Web 数据库与任务日志持久化
      # 供备份脚本 docker ps / docker exec 访问 Gitea 容器
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # 使用 profiles 防止默认启动
    profiles:
      - web
      - full
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # 定时任务服务 - 可选服务
  # 用途：自动定时执行备份任务
  # 默认：每天凌晨 2 点执行
  # 启动：docker compose up -d cron
  # 修改时间：编辑下面的 cron 表达式（0 2 * * *）
  # ============================================================
  cron:
    image: gitea-mirror-backup:latest
    container_name: gitea-backup-cron
    entrypoint: /bin/sh
    # Cron 表达式说明：分 时 日 月 周
    # 0 2 * * * = 每天凌晨 2:00
    # 0 */6 * * * = 每 6 小时一次
    # 0 0 * * 0 = 每周日凌晨
    command: -c "printenv | grep -v 'no_proxy' >> /etc/environment && echo '0 2 * * * . /etc/environment && cd /app && /usr/local/bin/python3 gitea_mirror_backup.py >> /logs/cron.log 2>&1' | crontab - && cron -f"
    environment:
      <<: *common-env
    env_file:
      - .env  # 从 .env 文件加载环境变量
    volumes: *common-volumes
    restart: unless-stopped
    # 使用 profiles 防止默认启动
    profiles:
      - cron
      - full
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

